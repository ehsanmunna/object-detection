
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Object Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f4f6f8;
            color: #222;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background: #111;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            margin: 8px 8px 8px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1769aa;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            font-weight: bold;
        }

        #detections {
            padding-left: 20px;
        }

        #detections li {
            margin: 8px 0;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Real-Time Object Detection</h1>
    <p>Browser webcam + Python FastAPI + YOLO</p>

    <div class="panel">
        <h2>Webcam</h2>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div>
            <button id="startButton">Start Detection</button>
            <button id="stopButton" disabled>Stop Detection</button>
        </div>

        <p>Status: <span id="status">Not started</span></p>
        <p class="hint">
            The browser sends reduced-size frames to the local Python server.
        </p>
    </div>

    <div class="panel">
        <h2>Detected Objects</h2>
        <p id="summary">No detection results yet.</p>
        <ul id="detections"></ul>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");
        const statusElement = document.getElementById("status");
        const summaryElement = document.getElementById("summary");
        const detectionsElement = document.getElementById("detections");

        let cameraStream = null;
        let socket = null;
        let captureTimer = null;
        let waitingForResult = false;
        let running = false;

        function setStatus(message) {
            statusElement.textContent = message;
        }

        async function startDetection() {
            if (running) return;

            try {
                setStatus("Requesting camera permission...");

                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = cameraStream;
                await video.play();

                setStatus("Connecting to Python server...");

                socket = new WebSocket(
                    `ws://${window.location.host}/ws/detect`
                );

                socket.onopen = () => {
                    running = true;
                    waitingForResult = false;

                    startButton.disabled = true;
                    stopButton.disabled = false;

                    setStatus("Connected — detecting objects...");

                    // Send a new frame only after the previous
                    // frame's result has arrived.
                    captureTimer = setInterval(sendFrame, 200);
                };

                socket.onmessage = (event) => {
                    waitingForResult = false;

                    const data = JSON.parse(event.data);

                    if (data.error) {
                        setStatus(data.error);
                        return;
                    }

                    showDetections(data.detections);
                };

                socket.onerror = () => {
                    setStatus("WebSocket error. Check the Python server.");
                };

                socket.onclose = () => {
                    cleanup();
                    setStatus("Connection closed.");
                };

            } catch (error) {
                cleanup();
                setStatus("Error: " + error.message);
                console.error(error);
            }
        }

        function sendFrame() {
            if (
                !running ||
                !socket ||
                socket.readyState !== WebSocket.OPEN ||
                waitingForResult ||
                video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
            ) {
                return;
            }

            // Resize the frame to reduce network and inference work.
            const maxWidth = 480;
            const scale = Math.min(
                maxWidth / video.videoWidth,
                1
            );

            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            waitingForResult = true;

            canvas.toBlob((blob) => {
                if (!blob || !running ||
                    socket.readyState !== WebSocket.OPEN) {
                    waitingForResult = false;
                    return;
                }

                socket.send(blob);
            }, "image/jpeg", 0.75);
        }

        function showDetections(detections) {
            detectionsElement.replaceChildren();

            summaryElement.textContent =
                `${detections.length} object(s) detected`;

            if (detections.length === 0) {
                const item = document.createElement("li");
                item.textContent = "No objects detected in this frame.";
                detectionsElement.appendChild(item);
                return;
            }

            for (const detection of detections) {
                const item = document.createElement("li");

                item.textContent =
                    `${detection.label} — ` +
                    `${(detection.confidence * 100).toFixed(1)}% confidence`;

                detectionsElement.appendChild(item);
            }
        }

        function cleanup() {
            running = false;
            waitingForResult = false;

            if (captureTimer !== null) {
                clearInterval(captureTimer);
                captureTimer = null;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            video.srcObject = null;

            startButton.disabled = false;
            stopButton.disabled = true;
        }

        function stopDetection() {
            cleanup();

            if (socket) {
                const oldSocket = socket;
                socket = null;

                if (
                    oldSocket.readyState === WebSocket.OPEN ||
                    oldSocket.readyState === WebSocket.CONNECTING
                ) {
                    oldSocket.close();
                }
            }

            setStatus("Stopped");
        }

        startButton.addEventListener("click", startDetection);
        stopButton.addEventListener("click", stopDetection);
    </script>
</body>
</html>
