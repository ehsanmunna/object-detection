
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Object Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f4f6f8;
            color: #222;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #111;
            overflow: hidden;
            border-radius: 8px;
            line-height: 0;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
        }

        #overlayCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #captureCanvas {
            display: none;
        }

        button {
            padding: 10px 18px;
            margin: 8px 8px 8px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1769aa;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            font-weight: bold;
        }

        #detections {
            padding-left: 20px;
        }

        #detections li {
            margin: 8px 0;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(340px, calc(100vw - 40px));
        }

        .toast {
            background: #172b3a;
            color: white;
            padding: 14px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 14px #0003;
            line-height: 1.5;
            animation: appear 0.2s ease-out;
        }

        .toast strong {
            display: block;
            margin-bottom: 3px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1>Real-Time Object Detection</h1>
    <p>Browser webcam + FastAPI + YOLO</p>

    <div class="panel">
        <h2>Webcam</h2>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
        </div>

        <canvas id="captureCanvas"></canvas>

        <button id="startButton">Start Detection</button>
        <button id="stopButton" disabled>Stop Detection</button>

        <p>Status: <span id="status">Not started</span></p>
        <p class="hint">
            Bounding boxes are drawn in your browser.
            Object detection runs on the Python server.
        </p>
    </div>

    <div class="panel">
        <h2>Detected Objects</h2>
        <p id="summary">No detection results yet.</p>
        <ul id="detections"></ul>
    </div>

    <div id="toastContainer" aria-live="polite"></div>

    <script>
        const video = document.getElementById("video");

        const captureCanvas =
            document.getElementById("captureCanvas");
        const captureContext =
            captureCanvas.getContext("2d");

        const overlayCanvas =
            document.getElementById("overlayCanvas");
        const overlayContext =
            overlayCanvas.getContext("2d");

        const startButton =
            document.getElementById("startButton");
        const stopButton =
            document.getElementById("stopButton");
        const statusElement =
            document.getElementById("status");
        const summaryElement =
            document.getElementById("summary");
        const detectionsElement =
            document.getElementById("detections");
        const toastContainer =
            document.getElementById("toastContainer");

        let cameraStream = null;
        let socket = null;
        let captureTimer = null;
        let waitingForResult = false;
        let running = false;

        // Only these object classes trigger notifications.
        const NOTIFY_OBJECTS = new Set([
            "person",
            "car",
            "dog",
            "phone"
        ]);

        // Each object class has its own notification cooldown.
        const TOAST_COOLDOWN_MS = 3000;
        const lastToastAt = new Map();

        function setStatus(message) {
            statusElement.textContent = message;
        }

        async function startDetection() {
            if (running || cameraStream) return;

            try {
                setStatus("Requesting camera permission...");

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                video.srcObject = cameraStream;
                await video.play();

                setStatus("Connecting to Python server...");

                const protocol =
                    window.location.protocol === "https:"
                        ? "wss:"
                        : "ws:";

                const wsUrl =
                    `${protocol}//${window.location.host}/ws/detect`;

                const newSocket = new WebSocket(wsUrl);
                socket = newSocket;

                newSocket.onopen = () => {
                    if (socket !== newSocket) return;

                    running = true;
                    waitingForResult = false;

                    startButton.disabled = true;
                    stopButton.disabled = false;

                    setStatus("Connected — detecting objects...");

                    captureTimer = setInterval(sendFrame, 200);
                };

                newSocket.onmessage = (event) => {
                    if (socket !== newSocket) return;

                    waitingForResult = false;

                    try {
                        const data = JSON.parse(event.data);

                        if (data.error) {
                            setStatus(data.error);
                            return;
                        }

                        showDetections(
                            data.detections || [],
                            data.width,
                            data.height
                        );
                    } catch (error) {
                        console.error("Invalid server response:", error);
                        setStatus("Could not read detection results.");
                    }
                };

                newSocket.onerror = () => {
                    if (socket === newSocket) {
                        setStatus(
                            "WebSocket error. Check the Python server."
                        );
                    }
                };

                newSocket.onclose = () => {
                    if (socket !== newSocket) return;

                    cleanup();
                    socket = null;
                    setStatus("Connection closed.");
                };

            } catch (error) {
                console.error(error);
                cleanup();

                if (socket) {
                    const oldSocket = socket;
                    socket = null;
                    oldSocket.close();
                }

                setStatus("Error: " + error.message);
            }
        }

        function sendFrame() {
            if (
                !running ||
                !socket ||
                socket.readyState !== WebSocket.OPEN ||
                waitingForResult ||
                video.readyState <
                    HTMLMediaElement.HAVE_CURRENT_DATA ||
                !video.videoWidth ||
                !video.videoHeight
            ) {
                return;
            }

            // Send a smaller image to reduce inference workload.
            const maxWidth = 480;
            const scale = Math.min(
                maxWidth / video.videoWidth,
                1
            );

            captureCanvas.width =
                Math.round(video.videoWidth * scale);
            captureCanvas.height =
                Math.round(video.videoHeight * scale);

            captureContext.drawImage(
                video,
                0,
                0,
                captureCanvas.width,
                captureCanvas.height
            );

            waitingForResult = true;

            captureCanvas.toBlob((blob) => {
                if (
                    !blob ||
                    !running ||
                    !socket ||
                    socket.readyState !== WebSocket.OPEN
                ) {
                    waitingForResult = false;
                    return;
                }

                socket.send(blob);
            }, "image/jpeg", 0.75);
        }

        function showDetections(detections, frameWidth, frameHeight) {
            drawBoundingBoxes(
                detections,
                frameWidth,
                frameHeight
            );

            detectionsElement.replaceChildren();

            summaryElement.textContent =
                `${detections.length} object(s) detected`;

            if (detections.length === 0) {
                const item = document.createElement("li");
                item.textContent = "No objects detected in this frame.";
                detectionsElement.appendChild(item);
                return;
            }

            for (const detection of detections) {
                const item = document.createElement("li");

                item.textContent =
                    `${detection.label} — ` +
                    `${(detection.confidence * 100).toFixed(1)}% confidence`;

                detectionsElement.appendChild(item);

                if (NOTIFY_OBJECTS.has(detection.label)) {
                    maybeShowToast(detection);
                }
            }
        }

        function drawBoundingBoxes(
            detections,
            frameWidth,
            frameHeight
        ) {
            const displayWidth = video.clientWidth;
            const displayHeight = video.clientHeight;

            if (
                !displayWidth ||
                !displayHeight ||
                !frameWidth ||
                !frameHeight
            ) {
                return;
            }

            // Match the overlay canvas to the displayed video size.
            const pixelRatio = window.devicePixelRatio || 1;

            overlayCanvas.width =
                Math.round(displayWidth * pixelRatio);
            overlayCanvas.height =
                Math.round(displayHeight * pixelRatio);

            overlayContext.setTransform(
                pixelRatio, 0, 0, pixelRatio, 0, 0
            );

            overlayContext.clearRect(
                0, 0, displayWidth, displayHeight
            );

            const scaleX = displayWidth / frameWidth;
            const scaleY = displayHeight / frameHeight;

            overlayContext.lineWidth = 3;
            overlayContext.font = "bold 15px Arial";

            for (const detection of detections) {
                const [x1, y1, x2, y2] = detection.box;

                const x = x1 * scaleX;
                const y = y1 * scaleY;
                const width = (x2 - x1) * scaleX;
                const height = (y2 - y1) * scaleY;

                const label =
                    `${detection.label} ` +
                    `${(detection.confidence * 100).toFixed(0)}%`;

                overlayContext.strokeStyle = "#00e676";
                overlayContext.strokeRect(
                    x, y, width, height
                );

                const textWidth =
                    overlayContext.measureText(label).width;

                const labelHeight = 23;
                const labelY = Math.max(0, y - labelHeight);

                overlayContext.fillStyle = "#00a854";
                overlayContext.fillRect(
                    x,
                    labelY,
                    textWidth + 12,
                    labelHeight
                );

                overlayContext.fillStyle = "#ffffff";
                overlayContext.fillText(
                    label,
                    x + 6,
                    labelY + 16
                );
            }
        }

        function maybeShowToast(detection) {
            const now = Date.now();
            const lastTime = lastToastAt.get(detection.label) || 0;

            if (now - lastTime < TOAST_COOLDOWN_MS) {
                return;
            }

            lastToastAt.set(detection.label, now);

            showToast(
                `${capitalize(detection.label)} detected`,
                `${(detection.confidence * 100).toFixed(1)}% confidence`
            );
        }

        function showToast(title, message) {
            const toast = document.createElement("div");
            toast.className = "toast";

            const heading = document.createElement("strong");
            heading.textContent = `🔔 ${title}`;

            const details = document.createElement("span");
            details.textContent = message;

            toast.append(heading, details);
            toastContainer.appendChild(toast);

            while (toastContainer.children.length > 4) {
                toastContainer.firstElementChild.remove();
            }

            setTimeout(() => toast.remove(), 3000);
        }

        function capitalize(value) {
            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function cleanup() {
            running = false;
            waitingForResult = false;

            if (captureTimer !== null) {
                clearInterval(captureTimer);
                captureTimer = null;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(
                    track => track.stop()
                );
                cameraStream = null;
            }

            video.srcObject = null;

            overlayContext.clearRect(
                0, 0, overlayCanvas.width, overlayCanvas.height
            );

            startButton.disabled = false;
            stopButton.disabled = true;
        }

        function stopDetection() {
            cleanup();

            if (socket) {
                const oldSocket = socket;
                socket = null;

                if (
                    oldSocket.readyState === WebSocket.OPEN ||
                    oldSocket.readyState === WebSocket.CONNECTING
                ) {
                    oldSocket.close();
                }
            }

            setStatus("Stopped");
        }

        startButton.addEventListener("click", startDetection);
        stopButton.addEventListener("click", stopDetection);

        window.addEventListener("resize", () => {
            // The next detection response redraws boxes at the
            // correct size for the resized video element.
            overlayContext.clearRect(
                0, 0, overlayCanvas.width, overlayCanvas.height
            );
        });
    </script>
</body>
</html>
